# The workflows pin every action to a commit SHA and the Dockerfile pins uv by digest (see
# tests/test_release_workflow.py): Dependabot proposes the updates, one grouped PR per ecosystem and week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new CPython line (3.12 -> 3.15) is a deliberate change: CI tests 3.10-3.14 and the image follows it by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directories: [/packaging, /packaging/pyinstaller]
    schedule:
      interval: weekly
    groups:
      build-tools:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /packaging/mcpb
    schedule:
      interval: weekly
    groups:
      packer:
        patterns: ["*"]
    commit-message:
      prefix: build
