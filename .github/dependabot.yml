# The workflows pin every action to a commit SHA and the Dockerfile pins uv by digest (see
# tests/test_release_workflow.py): Dependabot proposes the updates, one grouped PR per ecosystem and week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: build
