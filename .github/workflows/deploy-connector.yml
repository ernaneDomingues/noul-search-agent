name: Deploy public connector (Cloud Run)

# Builds the Docker image and deploys the public, read-only MCP connector to Cloud Run.
# One-time GCP setup, the `production` environment and the repository variables: docs/deploy/cloud-run.md.
# Skipped (with a notice) until the GCP_PROJECT_ID repository variable exists.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no service-account keys)

concurrency:
  group: deploy-connector
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-26.04
    # Required reviewers on this environment gate every deploy; the WIF condition also pins it (see docs).
    environment: production
    env:
      # Repository variables go through env (never interpolated into scripts).
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME || 'noul-connector' }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPO || 'noul' }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      RUN_SECRETS: ${{ vars.GCP_RUN_SECRETS }}
      MAX_INSTANCES: ${{ vars.GCP_MAX_INSTANCES || '3' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::notice::GCP is not configured (see docs/deploy/cloud-run.md); skipping the deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$RUNTIME_SA" ]; then
            echo "::error::GCP_RUNTIME_SERVICE_ACCOUNT is required (docs/deploy/cloud-run.md, step 6)."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.config.outputs.enabled == 'true'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.config.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.config.outputs.enabled == 'true'

      - name: Build and push the image
        if: steps.config.outputs.enabled == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        if: steps.config.outputs.enabled == 'true'
        run: |
          SECRETS_FLAG=()
          if [ -n "$RUN_SECRETS" ]; then
            SECRETS_FLAG=(--update-secrets "$RUN_SECRETS")
          fi
          # --update-env-vars keeps any tuning the operator set later (NOUL_TOOL_RATE_LIMIT, NOUL_LOG_LEVEL...).
          # Public access (allUsers -> run.invoker) is granted once by hand, so the deployer needs no IAM admin.
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --min-instances 0 \
            --max-instances "$MAX_INSTANCES" \
            --concurrency 80 \
            --cpu 1 \
            --memory 1Gi \
            --timeout 120 \
            --update-env-vars "NOUL_PUBLIC=1,NOUL_TRUSTED_PROXY=1" \
            "${SECRETS_FLAG[@]}" \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Smoke test the deployed connector
        if: steps.config.outputs.enabled == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz")
          if [ "$code" = "403" ]; then
            echo "::warning::The service is private. Grant public access once: docs/deploy/cloud-run.md, step 8."
            exit 0
          fi
          curl -fsS "$URL/healthz"
          curl -fsS -o body.txt \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            "$URL/mcp"
          grep -q '"serverInfo"' body.txt
          echo "### Public connector deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "MCP URL: \`$URL/mcp\`" >> "$GITHUB_STEP_SUMMARY"
