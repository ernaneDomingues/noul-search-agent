name: CI & Test Suite

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full test suite (default mode)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run full test suite (stdlib Pydantic fallback mode)
        env:
          NOUL_FORCE_PYDANTIC_FALLBACK: "1"
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify static site & MCP tools catalog synchronization
        run: python3 scripts/build_site.py --check
