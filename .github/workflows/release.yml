name: Release (executables and Claude Desktop extensions)

# Builds the single-file `noul` executable for Linux, macOS (arm64) and Windows, smoke-tests each as an MCP
# server, packs the Claude Desktop extensions (.mcpb: universal `uv` bundle + one `binary` bundle per OS) and,
# on a `v*` tag push, publishes everything to a new GitHub Release with SHA256SUMS and build provenance.
#
# Supply chain:
#   - every Python dependency comes from uv.lock / packaging/pyinstaller/requirements.txt with hashes, the MCPB
#     packer from packaging/mcpb/package-lock.json (npm ci), and every action is pinned by commit SHA;
#   - the build jobs never see a secret. Signing runs in separate jobs that execute no project code, only on tag
#     pushes, only when the `SIGNING_ENABLED` variable is "true", inside the protected `release` environment that
#     holds the signing secrets (docs/release/signing.md). Without it the files are published unsigned;
#   - publishing also runs in the `release` environment, never on pull requests or manual runs, and refuses to
#     overwrite an existing release.
# Pull requests touching packaging and manual runs are dry runs: artifacts only, nothing signed or published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_mcpb.py"
      - "scripts/smoke_mcp.py"
      - "src/noul/install.py"
      - "uv.lock"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.22"

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: the executable needs the build host's glibc or newer.
          - { os: ubuntu-22.04, asset: noul-linux-x64, exe: noul }
          - { os: macos-latest, asset: noul-macos-arm64, exe: noul }
          - { os: windows-latest, asset: noul-windows-x64.exe, exe: noul.exe }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install locked dependencies (hashes required)
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/runtime.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/runtime.txt"
          python -m pip install --require-hashes -r packaging/pyinstaller/requirements.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Build the executable
        shell: bash
        run: pyinstaller packaging/pyinstaller/noul.spec --noconfirm --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-${{ matrix.asset }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

  sign-macos:
    name: Sign and notarize (macOS)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ENABLED == 'true'
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe-noul-macos-arm64
          path: dist
      - name: Sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          umask 077
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Only codesign may use the key (no -A).
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KEYCHAIN"
          chmod +x dist/noul
          # The onefile bootloader extracts libpython and extension modules at runtime; they are not covered by
          # this signature, so the hardened runtime must allow loading them.
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
          codesign --force --options runtime --timestamp --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" dist/noul
          ditto -c -k --keepParent dist/noul "$RUNNER_TEMP/noul.zip"
          xcrun notarytool submit "$RUNNER_TEMP/noul.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
      - name: Remove the keychain and certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/noul.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-noul-macos-arm64
          path: dist/noul
          overwrite: true
          if-no-files-found: error

  sign-windows:
    name: Sign (Windows)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ENABLED == 'true'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe-noul-windows-x64.exe
          path: dist
      - uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-noul-windows-x64.exe
          path: dist/noul.exe
          overwrite: true
          if-no-files-found: error

  package:
    name: Smoke test and pack (${{ matrix.asset }})
    needs: [build, sign-macos, sign-windows]
    # Runs after signing, or right after the build when signing is skipped (pull requests, manual runs, no certs).
    if: always() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, asset: noul-linux-x64, platform: linux, exe: noul }
          - { os: macos-latest, asset: noul-macos-arm64, platform: darwin, exe: noul }
          - { os: windows-latest, asset: noul-windows-x64.exe, platform: win32, exe: noul.exe }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install locked dependencies and the MCPB packer
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/runtime.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/runtime.txt"
          npm ci --prefix packaging/mcpb --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe-${{ matrix.asset }}
          path: dist
      - name: Note unsigned build
        if: matrix.platform != 'linux' && !(needs.sign-macos.result == 'success' || needs.sign-windows.result == 'success')
        shell: bash
        run: echo "::notice::${{ matrix.asset }} is unsigned; see docs/release/signing.md."
      - name: Smoke test (CLI + MCP over stdio)
        shell: bash
        env:
          NOUL_HOME: ${{ runner.temp }}/noul-home
        run: |
          chmod +x "dist/${{ matrix.exe }}"
          "dist/${{ matrix.exe }}" --version
          python scripts/smoke_mcp.py -- "dist/${{ matrix.exe }}" mcp
      - name: Pack the binary Claude Desktop extension and the download
        shell: bash
        run: |
          python scripts/build_mcpb.py build --variant binary --exe "dist/${{ matrix.exe }}" \
            --platform "${{ matrix.platform }}" --out "out/noul-${{ matrix.platform }}.mcpb"
          if [ "${{ matrix.platform }}" = win32 ]; then
            cp "dist/${{ matrix.exe }}" "out/${{ matrix.asset }}"
          else
            # Browsers drop the executable bit; a tarball keeps it.
            tar -czf "out/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.exe }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.asset }}
          path: out/
          if-no-files-found: error

  uv-extension:
    name: Universal extension (uv)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Pack and smoke-test the uv bundle
        env:
          NOUL_HOME: ${{ runner.temp }}/noul-home
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/runtime.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/runtime.txt"
          npm ci --prefix packaging/mcpb --ignore-scripts --no-audit --no-fund
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="$(python -c 'import sys; sys.path.insert(0, "src"); import noul; print(noul.__version__)')"
            [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != version $VERSION"; exit 1; }
          fi
          python scripts/build_mcpb.py build --variant uv --out out/noul.mcpb
          packaging/mcpb/node_modules/.bin/mcpb unpack out/noul.mcpb "$RUNNER_TEMP/noul-uv"
          ENTRY="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["server"]["entry_point"])' "$RUNNER_TEMP/noul-uv/manifest.json")"
          # Both ways a host may start it: its own `uv run <entry_point>`, and the manifest's mcp_config.
          python scripts/smoke_mcp.py -- uv run --directory "$RUNNER_TEMP/noul-uv" --quiet "$ENTRY"
          python scripts/smoke_mcp.py -- uv run --project "$RUNNER_TEMP/noul-uv" --quiet --frozen noul-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-noul-uv-mcpb
          path: out/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [package, uv-extension]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.uv-extension.result == 'success'
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the release (never overwrites)
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace its assets. Delete it or tag a new version."
            exit 1
          fi
          PRERELEASE=()
          case "$TAG" in *-*) PRERELEASE=(--prerelease) ;; esac
          # Stable names (no version) so releases/latest/download/<file> links on the install page never change.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Noul $TAG" --generate-notes --verify-tag \
            "${PRERELEASE[@]}" -- *
