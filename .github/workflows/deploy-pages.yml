name: Deploy GitHub Pages Documentation & Landing Page

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tool registry needs the runtime dependencies (pydantic, mcp, ...). They come from uv.lock with hashes:
      # this job builds the site that is published, so nothing unpinned may run here.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install locked dependencies (hashes required)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/runtime.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/runtime.txt"
          python -m pip install --require-hashes -r packaging/build-backend.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify static site synchronization with MCP tools
        run: python scripts/build_site.py --check

      - name: Run unit test suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./site"

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
