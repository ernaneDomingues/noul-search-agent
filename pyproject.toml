[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noul-search-agent"
dynamic = ["version"]
description = "Autonomous Scientific Research & Document Intelligence Agent (Co-Scientist): MCP server, CLI, skill and subagent across CS/AI, Biomedical, Economics & STEM with deterministic Evidence Meter, benchmark/math/hardware/ablation extraction, multi-persona peer review, polyglot code/protocol scaffolding, academic authoring copilot, BibTeX sanitizer, rebuttal copilot and pre-submission desk-reject gatekeeper. Runs inside the user's own agent (no LLM of its own)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ernane Domingues" }]
keywords = ["mcp", "model-context-protocol", "scientific-literature", "co-scientist", "peer-review", "evidence", "openalex", "pubmed", "semantic-scholar", "europe-pmc", "arxiv", "claude", "copilot", "codex", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27.0", "mcp>=2.3,<3", "pydantic>=2.12.0", "pypdf>=4.0.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
# Kept for compatibility with v1 install commands; everything it used to add is now a core dependency.
pro = []
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://ernanedomingues.github.io/noul-search-agent/"
Documentation = "https://ernanedomingues.github.io/noul-search-agent/"
Repository = "https://github.com/ernaneDomingues/noul-search-agent"
Issues = "https://github.com/ernaneDomingues/noul-search-agent/issues"

[project.scripts]
noul = "noul.cli:main"
noul-search-agent = "noul.cli:main"
noul-mcp = "noul.server.mcp:main"
noul-install = "noul.install:main"

[tool.setuptools.dynamic]
version = { attr = "noul.__version__" }

# The root-level noul_*.py/install.py files are deprecated shims for source checkouts only; wheels ship `noul`.
[tool.setuptools.packages.find]
where = ["src"]

# Templates used by `noul-install` (looked up under <prefix>/share/noul-search-agent).
[tool.setuptools.data-files]
"share/noul-search-agent/skills/noul-search" = ["skills/noul-search/SKILL.md"]
"share/noul-search-agent/agents" = [
    "agents/AGENTS.snippet.md",
    "agents/claude-noul-researcher.md",
    "agents/copilot-noul-researcher.agent.md",
    "agents/gemini-extension.json",
]
"share/noul-search-agent/commands" = ["commands/noul-search-config.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["site"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the formatter owns line length; long regex/prompt literals are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/noul"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
# Gradual adoption: untyped defs are allowed; strict modules are opted in below as they are refactored.
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["noul.schemas.*"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests", "."]
addopts = "-q"

[tool.coverage.run]
source = ["noul"]
branch = true

[tool.coverage.report]
skip_empty = true
# Baseline measured at the start of the v2 refactor (Phase 0): 79% line+branch. Never lower this number.
fail_under = 78
