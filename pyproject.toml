[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noul-search-agent"
version = "1.0.0"
description = "Autonomous Scientific Research & Document Intelligence Agent (Co-Scientist): MCP server, CLI, skill and subagent across CS/AI, Biomedical, Economics & STEM with deterministic Evidence Meter, benchmark/math/hardware/ablation extraction, multi-persona peer review, polyglot code/protocol scaffolding, academic authoring copilot, BibTeX sanitizer, rebuttal copilot and pre-submission desk-reject gatekeeper. Zero mandatory dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ernane Domingues" }]
keywords = ["mcp", "model-context-protocol", "scientific-literature", "co-scientist", "peer-review", "evidence", "openalex", "pubmed", "semantic-scholar", "europe-pmc", "arxiv", "claude", "copilot", "codex", "gemini"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
pro = ["mcp>=1.6.0", "pydantic>=2.7.0", "httpx>=0.27.0", "typer>=0.12.0", "rich>=13.7.0", "pypdf>=4.0.0"]

[project.urls]
Homepage = "https://ernanedomingues.github.io/noul-search-agent/"
Documentation = "https://ernanedomingues.github.io/noul-search-agent/"
Repository = "https://github.com/ernaneDomingues/noul-search-agent"
Issues = "https://github.com/ernaneDomingues/noul-search-agent/issues"

[project.scripts]
noul = "noul_cli:main"
noul-search-agent = "noul_cli:main"
noul-mcp = "noul_mcp:main"
noul-install = "install:main"

[tool.setuptools]
py-modules = ["noul_core", "noul_tools", "noul_mcp", "noul_cli", "install"]
packages = ["noul", "noul.schemas", "noul.providers", "noul.tools", "noul.prompts"]

# Templates used by `noul-install` (looked up under <prefix>/share/noul-search-agent).
[tool.setuptools.data-files]
"share/noul-search-agent/skills/noul-search" = ["skills/noul-search/SKILL.md"]
"share/noul-search-agent/agents" = [
    "agents/AGENTS.snippet.md",
    "agents/claude-noul-researcher.md",
    "agents/copilot-noul-researcher.agent.md",
    "agents/gemini-extension.json",
]
"share/noul-search-agent/commands" = ["commands/noul-search-config.md"]
